# Publica o livro (site + PDF) no GitHub Pages a cada push na branch main.
# O PDF fica em https://vnikoofard.github.io/calculo-numerico-livro/calculo-numerico.pdf
# Requisito (uma vez só): Settings → Pages → Source = "GitHub Actions".
name: Publicar livro

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # O site fica em https://vnikoofard.github.io/calculo-numerico-livro
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # O PDF é gerado num job separado, em paralelo com o site, porque precisa
  # executar os notebooks com CNLIVRO_PNG=1 (figuras estáticas).
  pdf:
    runs-on: ubuntu-latest
    env:
      CNLIVRO_PNG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Instalar LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-xetex \
            texlive-latex-extra texlive-fonts-recommended texlive-lang-portuguese \
            texlive-science texlive-plain-generic lmodern
      - name: Instalar dependências
        # PyTorch só para CPU: o pacote padrão traz as bibliotecas CUDA (vários GB).
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Construir o PDF
        run: |
          export BROWSER_PATH="$(which google-chrome || which chromium || true)"
          jupyter book build --pdf --execute
      - uses: actions/upload-artifact@v4
        with:
          name: livro-pdf
          path: exports/calculo-numerico.pdf
          if-no-files-found: error

  publicar:
    needs: pdf
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Instalar dependências
        # PyTorch só para CPU: o pacote padrão traz as bibliotecas CUDA (vários GB).
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Construir o site (executando os notebooks)
        run: jupyter book build --html --execute
      - name: Incluir o pacote cnlivro no site (usado pelo JupyterLite)
        run: pip wheel . --no-deps -w _build/html/pacote
      - name: Incluir o PDF no site
        uses: actions/download-artifact@v4
        with:
          name: livro-pdf
          path: _build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
