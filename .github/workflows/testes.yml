# Verifica cada pull request: testes do pacote e construção do site.
name: Testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Instalar dependências
        # PyTorch só para CPU: o pacote padrão traz as bibliotecas CUDA (vários GB).
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Testes do pacote cnlivro
        run: pytest -q
      - name: Construir o site (executando os notebooks)
        run: jupyter book build --html --execute
