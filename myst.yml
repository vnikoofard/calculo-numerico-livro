# Configuração do livro (Jupyter Book 2 / MyST)
# Documentação: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: calculo-numerico-livro
  title: Cálculo Numérico na era dos agentes
  subtitle: Métodos numéricos para engenharia, com Python e agentes de IA
  authors:
    - name: Vahid Nikoofard
  github: https://github.com/vnikoofard/calculo-numerico-livro
  numbering:
    headings: false
    figure: true
    equation: true
  # Botão "executar" em cada página: roda o Python no navegador do leitor
  # (JupyterLite/Pyodide), sem servidor e sem instalar nada.
  jupyter:
    lite: true
  settings:
    myst_to_tex:
      code_style: minted
  exports:
    - id: livro-pdf
      format: pdf
      # Modelo próprio (latex/livro): realce do código, quebra de linhas, saídas
      # destacadas, acentos e símbolos, português e título do capítulo no cabeçalho.
      template: latex/livro
      output: exports/calculo-numerico.pdf
  toc:
    - file: livro/index.md
    - file: livro/00-como-usar.md
    - title: Parte I — Fundamentos
      children:
        - file: livro/01-modelagem.ipynb
        - file: livro/02-erros.ipynb
    - title: Parte II — Equações e sistemas
      children:
        - file: livro/03-raizes.ipynb
        - file: livro/04-sistemas-lineares.ipynb
        - file: livro/05-otimizacao.ipynb
    - title: Parte III — Dados e aproximação
      children:
        - file: livro/06-interpolacao.ipynb
        - file: livro/07-minimos-quadrados.ipynb
        - file: livro/08-autovalores-svd.ipynb
        - file: livro/09-aprendizado-de-maquina.ipynb
    - title: Parte IV — Cálculo
      children:
        - file: livro/10-derivacao.ipynb
        - file: livro/11-integracao.ipynb
    - title: Parte V — Equações diferenciais
      children:
        - file: livro/12-edo-valor-inicial.ipynb
        - file: livro/13-estabilidade-rigidez.ipynb
        - file: livro/14-problemas-de-contorno.ipynb
        - file: livro/15-edp-diferencas-finitas.ipynb
        - file: livro/16-metodo-das-linhas.ipynb
    - title: Apêndices
      children:
        - file: livro/A-incerteza.ipynb
        - file: livro/B-desempenho-gpu.ipynb
        - file: livro/C-referencia.md

site:
  template: book-theme
  # Botão no topo de todas as páginas. O PDF é gerado e publicado junto com o site
  # pelo workflow .github/workflows/publicar.yml.
  actions:
    - title: Baixar PDF
      url: https://vnikoofard.github.io/calculo-numerico-livro/calculo-numerico.pdf
  options:
    # Texto no canto superior esquerdo (sem ele, o tema mostra "Made with MyST")
    logo_text: Cálculo Numérico na era dos agentes
    folders: true
    hide_footer_links: false
